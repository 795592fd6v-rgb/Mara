services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mariageplusdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: .
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mariageplusdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: change-this-mariageplus-secret-key-32-bytes-min
      SERVER_PORT: 8000
    ports:
      - "8000:8000"

volumes:
  db-data:
